<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SmartLine Live Agent Demo</title>
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --accent: #0066ff;
        --ink: #0d0d0d;
        --muted: #6e6e80;
        --line: #e5e5e6;
        --soft: #f7f7f8;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #ffffff;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        padding: 0;
      }

      .demo-shell {
        display: grid;
        min-height: 100vh;
        grid-template-columns: minmax(280px, 0.88fr) minmax(340px, 1.12fr);
        background: #ffffff;
      }

      .demo-copy {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 32px;
        border-right: 1px solid var(--line);
        padding: 36px;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 750;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 520px;
        font-size: clamp(34px, 4vw, 58px);
        line-height: 1.02;
        letter-spacing: -0.01em;
      }

      .intro {
        margin: 20px 0 0;
        max-width: 560px;
        color: #4a4a5a;
        font-size: 17px;
        line-height: 1.62;
      }

      .prompt-list {
        display: grid;
        gap: 8px;
        margin-top: 26px;
      }

      .prompt-chip {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
        color: var(--ink);
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.35;
        padding: 12px 14px;
        text-align: left;
        transition: border-color 160ms ease, background 160ms ease;
      }

      .prompt-chip:hover {
        border-color: var(--accent);
        background: #ffffff;
      }

      .fine-print {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }

      .demo-stage {
        display: flex;
        min-height: 620px;
        align-items: stretch;
        justify-content: center;
        background: #07111f;
        padding: 26px;
      }

      .smartline-agent-widget {
        width: 100%;
        max-width: 680px;
      }

      .agent-window {
        display: flex;
        height: 100%;
        min-height: 568px;
        overflow: hidden;
        flex-direction: column;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      }

      .agent-window-header {
        display: flex;
        align-items: center;
        gap: 14px;
        border-bottom: 1px solid var(--line);
        padding: 18px;
      }

      .agent-avatar {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border-radius: 12px;
        background: var(--accent);
        color: #ffffff;
        font-weight: 800;
      }

      .agent-avatar.talking {
        box-shadow: 0 0 0 6px rgba(0, 102, 255, 0.14);
      }

      .agent-info h3 {
        margin: 0;
        color: var(--ink);
        font-size: 18px;
        line-height: 1.2;
      }

      .agent-info span {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 13px;
      }

      .agent-waveform {
        display: flex;
        min-height: 90px;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border-bottom: 1px solid var(--line);
        background: #f8fbff;
      }

      .agent-waveform .bar {
        width: 6px;
        height: 22px;
        border-radius: 999px;
        background: var(--accent);
        opacity: 0.72;
        transform-origin: center;
      }

      .agent-waveform.talking .bar:nth-child(1) { animation: wave 0.74s infinite ease-in-out; }
      .agent-waveform.talking .bar:nth-child(2) { animation: wave 0.62s 0.08s infinite ease-in-out; }
      .agent-waveform.talking .bar:nth-child(3) { animation: wave 0.8s 0.04s infinite ease-in-out; }
      .agent-waveform.talking .bar:nth-child(4) { animation: wave 0.66s 0.12s infinite ease-in-out; }
      .agent-waveform.talking .bar:nth-child(5) { animation: wave 0.7s 0.02s infinite ease-in-out; }
      .agent-waveform.talking .bar:nth-child(6) { animation: wave 0.78s 0.1s infinite ease-in-out; }
      .agent-waveform.talking .bar:nth-child(7) { animation: wave 0.64s 0.06s infinite ease-in-out; }
      .agent-waveform.talking .bar:nth-child(8) { animation: wave 0.82s 0.14s infinite ease-in-out; }
      .agent-waveform.talking .bar:nth-child(9) { animation: wave 0.68s infinite ease-in-out; }

      @keyframes wave {
        0%, 100% { transform: scaleY(0.6); }
        50% { transform: scaleY(2.2); }
      }

      .agent-window-body {
        display: flex;
        min-height: 0;
        flex: 1;
        flex-direction: column;
        gap: 14px;
        padding: 16px;
      }

      .agent-messages {
        min-height: 260px;
        flex: 1;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #ffffff;
        padding: 14px;
      }

      .agent-msg {
        display: flex;
        margin-bottom: 10px;
      }

      .agent-msg p {
        max-width: 82%;
        margin: 0;
        border-radius: 13px;
        padding: 10px 12px;
        font-size: 14px;
        line-height: 1.5;
      }

      .agent-msg-user {
        justify-content: flex-end;
      }

      .agent-msg-user p {
        background: var(--accent);
        color: #ffffff;
      }

      .agent-msg-assistant p {
        background: var(--soft);
        color: var(--ink);
      }

      .agent-mic-notice {
        display: none;
        border: 1px solid #dbeafe;
        border-radius: 10px;
        background: #eff6ff;
        color: #1d4ed8;
        padding: 10px 12px;
      }

      .agent-mic-notice p {
        margin: 0;
        font-size: 12px;
        line-height: 1.45;
      }

      .agent-controls {
        display: grid;
        gap: 10px;
      }

      .agent-input-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }

      .sl-chat-input {
        min-width: 0;
        height: 46px;
        border: 1px solid var(--line);
        border-radius: 9px;
        color: var(--ink);
        font: inherit;
        padding: 0 13px;
      }

      .sl-chat-input:focus {
        border-color: var(--accent);
        outline: none;
        box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.12);
      }

      .agent-voice-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .btn-send,
      .btn-voice,
      .btn-stop {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 0;
        border-radius: 9px;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 0 15px;
      }

      .btn-send,
      .btn-voice {
        background: var(--ink);
        color: #ffffff;
      }

      .btn-stop {
        background: #fee2e2;
        color: #991b1b;
      }

      .btn-icon {
        width: 17px;
        height: 17px;
      }

      .sl-voice-off {
        display: none;
      }

      .agent-status {
        min-height: 19px;
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }

      .agent-status.error {
        color: #b91c1c;
      }

      @media (max-width: 840px) {
        .demo-shell {
          grid-template-columns: 1fr;
        }

        .demo-copy {
          border-right: 0;
          border-bottom: 1px solid var(--line);
          padding: 26px;
        }

        .demo-stage {
          min-height: 620px;
          padding: 18px;
        }

        .agent-window {
          min-height: 560px;
        }
      }
    </style>
  </head>
  <body>
    <main class="demo-shell">
      <section class="demo-copy" aria-label="SmartLine live demo">
        <div>
          <p class="eyebrow">Live agent demo</p>
          <h1>Live challenge — test the agent now</h1>
          <p class="intro">
            Type or click Start Voice to talk. Ask what real buyers ask: price, timing,
            objections, languages, or human handoff.
          </p>
          <div class="prompt-list" aria-label="Demo prompts">
            <button class="prompt-chip" type="button">Sell me this system</button>
            <button class="prompt-chip" type="button">I'm comparing you to hiring a receptionist</button>
            <button class="prompt-chip" type="button">What would this cost for my business?</button>
            <button class="prompt-chip" type="button">I don't trust bots. Change my mind.</button>
            <button class="prompt-chip" type="button">What happens when a customer wants a human?</button>
          </div>
        </div>
        <p class="fine-print">
          This is the ready-to-use Lead Agents Studio SmartLine web widget connected to the live
          SmartLine API.
        </p>
      </section>

      <section class="demo-stage" aria-label="SmartLine agent widget">
        <div
          data-smartline-agent
          data-agent-name="SmartLine — Live Agent"
          data-agent-avatar="SL"
        ></div>
      </section>
    </main>

    <script src="/smartline-agent.js"></script>
    <script>
      document.querySelectorAll(".prompt-chip").forEach((button) => {
        button.addEventListener("click", () => {
          const input = document.querySelector(".sl-chat-input");
          const send = document.querySelector(".sl-send-btn");
          if (!input || !send) return;
          input.value = button.textContent.trim();
          input.focus();
          send.click();
        });
      });
    </script>
  </body>
</html>
